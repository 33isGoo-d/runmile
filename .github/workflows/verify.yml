name: 프로젝트 검증

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend 테스트 및 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew
      - name: 테스트 및 실행 JAR 생성
        run: ./gradlew --no-daemon clean test bootJar

  frontend:
    name: Frontend 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "26.8.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: Production 빌드
        run: npm run build

  ai:
    name: AI 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 테스트
        run: pytest -q
