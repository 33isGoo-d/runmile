spring:
  application:
    name: runmile-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:runmile}
    username: ${POSTGRES_USER:runmile}
    password: ${POSTGRES_PASSWORD:runmile_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}
