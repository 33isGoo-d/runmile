services:
  postgres:
    image: postgres:16-alpine
    container_name: runmile-postgres
    environment:
      POSTGRES_DB: runmile
      POSTGRES_USER: runmile
      POSTGRES_PASSWORD: runmile_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runmile -d runmile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
